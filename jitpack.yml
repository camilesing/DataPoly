# JitPack 构建配置说明：供以 Maven 依赖方式消费核心链的宿主扩展
# （如 datapoly-extension，坐标 com.github.camilesing.DataPoly:<模块名>:<版本>）使用。
#
# 本文件刻意不写任何 jdk/install 指令：JitPack 的 install 指令环境自带
# 3.6.3 之前的旧 Maven，跑不了本仓库钉版的 maven-compiler-plugin 3.15.0
# （要求 Maven ≥ 3.6.3），会以 PluginIncompatibleException 失败。
# 默认全量构建（mvn install，复用仓库 CI 语义）在 JitPack 上已实测通过。