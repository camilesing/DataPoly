name: Feature request
description: Suggest an idea or improvement
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem, e.g. "I'm always frustrated when [...]" / 与该需求相关的问题场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: 期望的解决方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: 已考虑过的替代方案
