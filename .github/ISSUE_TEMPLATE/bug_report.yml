name: Bug report
description: Something is not working as expected
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the sections below.
        感谢反馈！请尽量完整填写以下内容，便于定位问题。
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the problem / 问题的清晰描述
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - manager
        - executor
        - gateway
        - built-in UI (manager web)
        - docker / deployment
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DataPoly version
      placeholder: e.g. 1.9.0
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database type & version (if relevant)
      placeholder: e.g. MySQL 8.0
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction steps / 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      placeholder: Include relevant log output (remove credentials first!)
    validations:
      required: true
