# manager节点的host地址
MANAGER_HOST=127.0.0.1


# manager的端口号
MANAGER_PORT=8090

# executor的端口号
EXECUTOR_PORT=8092

# gateway的端口号
GATEWAY_PORT=8091


# 数据库类型:mysql或postgres
DB_TYPE=mysql

# mysql的host地址（示例值，请按实际环境修改）
MYSQLDB_HOST=192.168.1.100
# mysql的端口号
MYSQLDB_PORT=3306
# mysql的库名
MYSQLDB_NAME=datapoly
# mysql的账号
MYSQLDB_USERNAME=root
# mysql的密码（示例值，生产环境必须修改）
MYSQLDB_PASSWORD=123456

# pgsql的host地址（示例值，请按实际环境修改）
PGDB_HOST=192.168.1.100
# pgsql的端口号
PGDB_PORT=5432
# pgsql的库名
PGDB_NAME=datapoly
# pgsql的账号
PGDB_USERNAME=postgres
# pgsql的密码（示例值，生产环境必须修改）
PGDB_PASSWORD=123456

# JSON序列化时区设置
JSON_TIMEZONE=Asia/Shanghai

# 数据源账号密码是否加密存储
DATAPOLY_DS_ENCRYPT=false

# 外部配置化网关/管理地址，默认为空
# DATAPOLY_MANAGER_URL=http://www.example.com:8090
# DATAPOLY_GATEWAY_URL=http://www.example.com:8091

# 飞书登录（datapoly-extension-feishu 扩展模块；未装配该扩展时全部留空即可）
# App ID / App Secret 取自飞书开发者后台「凭证与基础信息」；真实值请只填在部署现场，
# 不要写回仓库
# DATAPOLY_FEISHU_ENABLED=true
# DATAPOLY_FEISHU_APP_ID=
# DATAPOLY_FEISHU_APP_SECRET=
# 回调地址必须与开发者后台「安全设置 → 重定向 URL」逐字一致，取对外可达的网关地址；
# 未配置或与登记值不符时飞书会直接跳失败页，登录页则不显示飞书按钮
# DATAPOLY_FEISHU_REDIRECT_URI=https://www.example.com:8091/user/feishu/callback