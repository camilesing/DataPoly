version: '3.3'
services:
  mysqldb:
    container_name: datapoly_mysqldb
    # 基镜像钉 digest（tag 可被上游覆盖）；升级 mysql 时须同步刷新
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    networks:
      datapoly-net:
        ipv4_address: 172.28.0.10
    volumes:
      - "/data/mysql:/var/lib/mysql"
    environment:
      MYSQL_DATABASE: datapoly
      MYSQL_USER: datapoly
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_ROOT_HOST: '%'
    # 会话时区对齐 +08:00（北京时间）：与应用 JDBC serverTimezone=Asia/Shanghai 一致，
    # 否则 TIMESTAMP 读回会按 UTC 壁钟 + 上海解释偏移 8 小时
    command: --default-time-zone=+08:00
    healthcheck:
      test: [ "CMD", "mysql", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}" ,"-e"," select 1 " ]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
  manager:
    container_name: datapoly_manager
    image: camilesing/datapoly-manager:latest
    networks:
      datapoly-net:
        ipv4_address: 172.28.0.20
    environment:
      DB_TYPE: mysql
      MYSQLDB_HOST: mysqldb
      MYSQLDB_PORT: 3306
      MYSQLDB_USERNAME: datapoly
      MYSQLDB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQLDB_NAME: datapoly
      MANAGER_HOST: manager
      MANAGER_PORT: 8090
      EXECUTOR_PORT: 8092
      GATEWAY_PORT: 8091
      DATAPOLY_DS_ENCRYPT: false
      # 部署后请务必设置：覆盖种子 admin 口令（S5）
      DATAPOLY_ADMIN_PASSWORD: ${DATAPOLY_ADMIN_PASSWORD:-}
      # 飞书登录（datapoly-extension-feishu，relaxed binding 映射为 datapoly.feishu.*）：
      # 真实值由 install/.env 注入，勿写回本文件；三项凭证缺一或开关关闭时登录页不显示飞书按钮
      DATAPOLY_FEISHU_ENABLED: ${DATAPOLY_FEISHU_ENABLED:-false}
      DATAPOLY_FEISHU_APP_ID: ${DATAPOLY_FEISHU_APP_ID:-}
      DATAPOLY_FEISHU_APP_SECRET: ${DATAPOLY_FEISHU_APP_SECRET:-}
      DATAPOLY_FEISHU_REDIRECT_URI: ${DATAPOLY_FEISHU_REDIRECT_URI:-}
    #      DATAPOLY_MANAGER_URL: http://www.example.com:8090
    #      DATAPOLY_GATEWAY_URL: http://www.example.com:8091
    depends_on:
      mysqldb:
        condition: service_healthy
    # manager 就绪（含自身注册进 Eureka）后 gateway 才启动，消除启动期访问 8091 返回空 503 的窗口
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
  executor:
    container_name: datapoly_executor
    image: camilesing/datapoly-executor:latest
    networks:
      datapoly-net:
        ipv4_address: 172.28.0.30
    environment:
      DB_TYPE: mysql
      MYSQLDB_HOST: mysqldb
      MYSQLDB_PORT: 3306
      MYSQLDB_USERNAME: datapoly
      MYSQLDB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQLDB_NAME: datapoly
      MANAGER_HOST: manager
      MANAGER_PORT: 8090
      EXECUTOR_PORT: 8092
      GATEWAY_PORT: 8091
      DATAPOLY_DS_ENCRYPT: false
      # 仅信任网关与本机（S2），不对外发布端口
      DATAPOLY_EXECUTOR_GATEWAY_ENABLED: "true"
      DATAPOLY_EXECUTOR_GATEWAY_TRUSTED_CIDRS: 127.0.0.1,::1,172.28.0.40
      DATAPOLY_EXECUTOR_GATEWAY_AUTH_TOKEN: ${DATAPOLY_GATEWAY_TOKEN:-}
      # 内置 oss 投递 sink（经 relaxed binding 映射为 oss.*）：真实值由 install/.env 注入，勿写回本文件
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_INTERNAL_ENDPOINT: ${OSS_INTERNAL_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PRESIGN_EXPIRE_SECONDS: ${OSS_PRESIGN_EXPIRE_SECONDS:-3600}
      OSS_TMP_DIR: ${OSS_TMP_DIR:-}
      OSS_ARTIFACT_BASE_URL: ${OSS_ARTIFACT_BASE_URL:-}
      OSS_WEBHOOK_URL: ${OSS_WEBHOOK_URL:-}
      OSS_WEBHOOK_TOKEN: ${OSS_WEBHOOK_TOKEN:-}
      OSS_WEBHOOK_CONNECT_TIMEOUT_MS: ${OSS_WEBHOOK_CONNECT_TIMEOUT_MS:-5000}
      OSS_WEBHOOK_READ_TIMEOUT_MS: ${OSS_WEBHOOK_READ_TIMEOUT_MS:-5000}
      # ODPS(MaxCompute) 服务端导出路径（经 relaxed binding 映射为 odps.*，详见扩展 odps.yaml）：
      # oss-endpoint 是 MaxCompute 写目标 bucket 时用的 OSS endpoint（同地域内网端点），
      # 留空则该路径报错要求配置；role-arn 是 MaxCompute 承担的 RAM 角色，项目已一键授权时可留空
      ODPS_OSS_ENDPOINT: ${ODPS_OSS_ENDPOINT:-}
      ODPS_ROLE_ARN: ${ODPS_ROLE_ARN:-}
    depends_on:
      mysqldb:
        condition: service_healthy
    # 探测来自容器内 loopback：GatewaySourceFilter 恒信任 loopback；token 头与上方配置同源
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-DATAPOLY-Gateway-Token: $${DATAPOLY_EXECUTOR_GATEWAY_AUTH_TOKEN:-}\" http://localhost:8092/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 90s
  gateway:
    container_name: datapoly_gateway
    image: camilesing/datapoly-gateway:latest
    networks:
      datapoly-net:
        ipv4_address: 172.28.0.40
    environment:
      DB_TYPE: mysql
      MYSQLDB_HOST: mysqldb
      MYSQLDB_PORT: 3306
      MYSQLDB_USERNAME: datapoly
      MYSQLDB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQLDB_NAME: datapoly
      MANAGER_HOST: manager
      MANAGER_PORT: 8090
      EXECUTOR_PORT: 8092
      GATEWAY_PORT: 8091
      DATAPOLY_DS_ENCRYPT: false
      # 与 executor 的 DATAPOLY_EXECUTOR_GATEWAY_AUTH_TOKEN 保持一致（S2）
      # gateway 的 AddRequestHeader 不允许空值，未设置密钥时注入哨兵 UNSET（executor 未配置 auth-token 时忽略该头）
      DATAPOLY_GATEWAY_TOKEN: ${DATAPOLY_GATEWAY_TOKEN:-UNSET}
    ports:
      - 8091:8091
    depends_on:
      mysqldb:
        condition: service_healthy
      manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 90s

networks:
  datapoly-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
